name: Release (Windows portable)

# 仅手动触发：推送代码不会运行本工作流。
# 发布方式：Actions → Release (Windows portable) → Run workflow
#   - 版本号取自 package.json，标签 vX.Y.Z 由工作流自动创建，无需手动打标签
#   - 若该版本已发布则跳过；勾选 force 可强制重建并覆盖同名 Release
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并覆盖同名 Release'
        type: boolean
        default: false

permissions:
  contents: write

# 连续手动运行串行执行，避免两个 release job 互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先判断当前 package.json 的版本是否已经发布，避免每次改动 package.json 都重复构建
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if [ "$FORCE" = "true" ]; then
            echo "force 已勾选，跳过已发布检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/releases/tags/$tag" > /dev/null 2>&1; then
            echo "$tag 已存在，跳过本次发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag 尚未发布，开始构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm 版本唯一来源：package.json 的 packageManager 字段（pnpm@12.18.0）
      # action-setup 会自动读取该字段，不能再传 version，否则报版本冲突
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version to Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable executable
        run: pnpm tauri build --no-bundle

      - name: Prepare portable exe
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $exe = "src-tauri/target/release/mi-home-toolkit.exe"
          if (!(Test-Path $exe)) {
            Write-Error "未找到构建产物：$exe"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $dest = "artifacts/MiHomeToolkit-$version-windows-x64.exe"
          Copy-Item $exe $dest
          Get-Item $dest | Select-Object Name, Length

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $header = "## Mi Home Toolkit v$version`r`n`r`n"
          $notes = Get-Content doc/RELEASE_NOTES.md -Raw
          $path = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $path -Value ($header + $notes) -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          overwrite_files: true
          files: artifacts/*.exe
