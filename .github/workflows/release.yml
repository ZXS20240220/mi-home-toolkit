name: Release (Windows portable)

# 触发方式：
#   1. 向 dev 分支推送改动 package.json 的提交，且其中的 version 尚未发布
#      → 自动构建，并创建对应的 vX.Y.Z 标签和 Release（标签由工作流生成，无需手动打标签）
#   2. 手动运行（Actions → Release → Run workflow），可勾选 force 覆盖同名 Release
on:
  push:
    branches:
      - dev
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并覆盖同名 Release'
        type: boolean
        default: false

permissions:
  contents: write

# 同一分支的连续推送串行执行，避免两个 release job 互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先判断当前 package.json 的版本是否已经发布，避免每次改动 package.json 都重复构建
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if [ "$FORCE" = "true" ]; then
            echo "force 已勾选，跳过已发布检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/releases/tags/$tag" > /dev/null 2>&1; then
            echo "$tag 已存在，跳过本次发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag 尚未发布，开始构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version to Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable executable
        run: pnpm tauri build --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $exe = "src-tauri/target/release/mi-home-toolkit.exe"
          if (!(Test-Path $exe)) {
            Write-Error "未找到构建产物：$exe"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $exe staging/
          Copy-Item doc/RELEASE_NOTES.md staging/README.md

          $zip = "artifacts/MiHomeToolkit-$version-windows-x64-portable.zip"
          Compress-Archive -Path staging/* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $header = "## Mi Home Toolkit v$version`r`n`r`n"
          $notes = Get-Content doc/RELEASE_NOTES.md -Raw
          $path = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $path -Value ($header + $notes) -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          overwrite_files: true
          files: artifacts/*.zip
