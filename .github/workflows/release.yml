name: Release (Windows portable)

# 推送 v* 标签时自动构建并发布；也可以在 Actions 页面手动运行。
# 版本号唯一来源是 package.json，标签必须与之对应（如版本 1.5.0 → v1.5.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "value=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.value }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            Write-Error "标签 '${{ github.ref_name }}' 与 package.json 版本不匹配，应为 '$expected'"
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version to Cargo.toml
        run: node scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable executable
        run: pnpm tauri build --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exe = "src-tauri/target/release/mi-home-toolkit.exe"
          if (!(Test-Path $exe)) {
            Write-Error "未找到构建产物：$exe"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $exe staging/
          Copy-Item doc/RELEASE_NOTES.md staging/README.md

          $zip = "artifacts/MiHomeToolkit-$version-windows-x64-portable.zip"
          Compress-Archive -Path staging/* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $header = "## Mi Home Toolkit v$version`r`n`r`n"
          $notes = Get-Content doc/RELEASE_NOTES.md -Raw
          $path = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $path -Value ($header + $notes) -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: false
          files: artifacts/*.zip
